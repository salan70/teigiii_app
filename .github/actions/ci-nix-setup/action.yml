name: CI Nix setup
description: Install Nix and optionally restore Flutter/pub caches for mobile CI jobs

inputs:
  cache-flutter:
    description: Cache .nix/flutter SDK bootstrap directory
    required: false
    default: "false"
  cache-pub:
    description: Cache .nix/pub-cache
    required: false
    default: "false"
  touch-env:
    description: Create non-empty mobile_app/.env placeholder for Flutter asset + dotenv.load
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/determinate-nix-action@v3

    - name: Cache Flutter SDK bootstrap
      id: flutter-cache
      if: inputs.cache-flutter == 'true'
      uses: actions/cache@v4
      with:
        path: .nix/flutter
        key: flutter-${{ runner.os }}-${{ hashFiles('flake.nix', 'nix/patches/**') }}
        restore-keys: |
          flutter-${{ runner.os }}-

    - name: Cache pub
      if: inputs.cache-pub == 'true'
      uses: actions/cache@v4
      with:
        path: .nix/pub-cache
        key: pub-${{ runner.os }}-${{ hashFiles('mobile_app/pubspec.lock') }}
        restore-keys: |
          pub-${{ runner.os }}-

    # exact cache miss でも restore-keys で旧 SDK が戻ることがある。
    # stamp 一致なら nix run（flutterSrc 実現）を避け、不一致のときだけ bootstrap する。
    - name: Bootstrap Flutter SDK
      if: inputs.cache-flutter == 'true' && steps.flutter-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="$(nix eval --raw .#flutterVersion)"
        expected="$(nix eval --raw .#flutterToolchainRevision)"
        flutter_root=".nix/flutter/${version}"
        stamp_file="${flutter_root}/.nix-flutter-version"
        if [ -x "${flutter_root}/bin/flutter" ] && [ -f "$stamp_file" ] && [ "$(cat "$stamp_file")" = "$expected" ]; then
          echo "Flutter SDK already present (${expected}); skip bootstrap"
          exit 0
        fi
        nix run .#bootstrap-flutter

    - name: Create dot env file
      if: inputs.touch-env == 'true'
      shell: bash
      # flutter_dotenv は空ファイルで EmptyEnvFileError を投げる。
      # Web preview など実行時ロードがあるジョブではコメントだけの非空ファイルが必要。
      run: |
        printf '%s\n' \
          '# CI placeholder for required Flutter asset.' \
          '# AdMob banner IDs are unused here (web preview / analyze / test).' \
          > mobile_app/.env
