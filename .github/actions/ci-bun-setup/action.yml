name: CI Bun setup
description: Install Bun and restore the Bun package cache for backend CI jobs

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Cache bun
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('backend/bun.lockb') }}
        restore-keys: |
          bun-${{ runner.os }}-
