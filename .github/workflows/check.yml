name: check

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.gates.outputs.mobile }}
      backend: ${{ steps.gates.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'mobile_app/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'justfile'
              - '.github/workflows/check.yml'
              - '.github/actions/**'
            backend:
              - 'backend/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'justfile'
              - '.github/workflows/check.yml'
              - '.github/actions/**'

      # フィルタ外の変更で workflow が起動した場合は両方走らせる（黙って skip しない）
      - name: Resolve job gates
        id: gates
        run: |
          mobile="${{ steps.filter.outputs.mobile }}"
          backend="${{ steps.filter.outputs.backend }}"
          if [ "$mobile" != "true" ] && [ "$backend" != "true" ]; then
            mobile=true
            backend=true
          fi
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  mobile-analyze:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI Nix setup
        id: nix
        uses: ./.github/actions/ci-nix-setup
        with:
          cache-flutter: "true"
          cache-pub: "true"
          touch-env: "true"

      # Actions cache miss のときだけ flutterSrc を実現して .nix/flutter を構築する
      - name: Bootstrap Flutter SDK
        if: steps.nix.outputs.flutter-cache-hit != 'true'
        run: nix run .#bootstrap-flutter

      - name: Install dependencies
        run: nix develop .#ci-mobile --command just mobile-setup

      - name: Analyze
        run: nix develop .#ci-mobile --command just mobile-analyze

  mobile-test:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # toDisplayFormat の UTC→ローカル変換漏れを検出するため非 UTC に固定
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI Nix setup
        id: nix
        uses: ./.github/actions/ci-nix-setup
        with:
          cache-flutter: "true"
          cache-pub: "true"
          touch-env: "true"

      - name: Bootstrap Flutter SDK
        if: steps.nix.outputs.flutter-cache-hit != 'true'
        run: nix run .#bootstrap-flutter

      - name: Install dependencies
        run: nix develop .#ci-mobile --command just mobile-setup

      - name: Test
        run: nix develop .#ci-mobile --command just mobile-test

  backend-analyze:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI Bun setup
        uses: ./.github/actions/ci-bun-setup

      - name: Install dependencies
        run: cd backend && bun install

      - name: Analyze
        run: cd backend && bun run lint && bun run typecheck

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI Bun setup
        uses: ./.github/actions/ci-bun-setup

      - name: Install dependencies
        run: cd backend && bun install

      - name: Test
        run: cd backend && bun run test
