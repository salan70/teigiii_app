name: web-preview

# PR 限定。develop push では常設プレビューを作らない
# （常設 URL が必要になったら Pages の production branch として設定する）。
on:
  pull_request:
    paths:
      - 'mobile_app/**'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
      - 'justfile'
      - '.github/workflows/web-preview.yml'
      - '.github/actions/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # WEB_PREVIEW_ENABLED が true のときだけ動く。
    # 有効化済みなのに secrets が無い場合は設定ミスとして落とす。
    if: ${{ vars.WEB_PREVIEW_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'teigiii-web-dev' }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      APP_CHECK_DEBUG_TOKEN: ${{ secrets.APP_CHECK_DEBUG_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Cloudflare secrets
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${FIREBASE_WEB_API_KEY:-}" ]] || missing+=("FIREBASE_WEB_API_KEY")
          [[ -n "${FIREBASE_WEB_APP_ID:-}" ]] || missing+=("FIREBASE_WEB_APP_ID")
          [[ -n "${APP_CHECK_DEBUG_TOKEN:-}" ]] || missing+=("APP_CHECK_DEBUG_TOKEN")
          if ((${#missing[@]} > 0)); then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      - name: CI Nix setup
        uses: ./.github/actions/ci-nix-setup
        with:
          cache-flutter: "true"
          cache-pub: "true"
          touch-env: "true"

      - name: Install dependencies
        run: nix develop .#ci-mobile --command just mobile-setup

      - name: Build Flutter Web (dev)
        run: nix develop .#ci-mobile --command just web-build

      - name: Resolve Pages branch
        id: branch
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # deploy-web-pages.sh は backend の wrangler を優先する。
      # bunx --bun だと非 TTY で即終了することがあるため、CI では実体を入れる。
      - name: Install wrangler (backend)
        run: cd backend && bun install --frozen-lockfile

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_PAGES_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          # stdout は URL 1 行のみ。スクリプトが GITHUB_OUTPUT にも書く。
          url="$(bash mobile_app/scripts/deploy-web-pages.sh)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"

      - name: Sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- teigiii-web-preview -->';
            const body = `${marker}
            ## Web QA Preview

            ${url}

            - dev 固定の使い捨てミラー（実 everyone-teigi-dev / 実 D1）
            - **backend はこの PR の内容ではない。** 叩く先は共有の dev Worker
              （\`teigiii-api-dev\`）で、中身は develop の backend。
              backend の変更を確認したい場合は develop に merge するか、
              手元で \`just backend-deploy-dev\` を実行すること
            - **Basic 認証必須**（credentials は Pages secrets。PR には書かない）
            - Web 非対応の native 機能は無効化
            `;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
