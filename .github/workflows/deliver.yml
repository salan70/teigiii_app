name: deliver

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the signed IPA to App Store Connect
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Import Provisioning Profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/distribution.mobileprovision

      - name: Import Certificate
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_P12_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_P12_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_P12_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Create dot env file
        run: |
          touch mobile_app/.env
          echo "BANNER_ID_IOS=${{ secrets.BANNER_ID_IOS }}" >> mobile_app/.env
          echo "BANNER_ID_ANDROID=${{ secrets.BANNER_ID_ANDROID }}" >> mobile_app/.env

      - name: Install dependencies
        run: nix develop --command just mobile-setup

      - name: Prepare Crashlytics scripts
        run: |
          package_resolved=mobile_app/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
          firebase_revision="$(
            jq -r '.pins[] | select(.identity == "firebase-ios-sdk") | .state.revision' \
              "$package_resolved"
          )"
          if [[ -z "$firebase_revision" || "$firebase_revision" == "null" ]]; then
            echo "Firebase iOS SDK revision was not found in $package_resolved." >&2
            exit 1
          fi

          crashlytics_dir="$RUNNER_TEMP/FirebaseCrashlytics"
          mkdir -p "$crashlytics_dir"
          for script in run upload-symbols; do
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/firebase/firebase-ios-sdk/$firebase_revision/Crashlytics/$script" \
              --output "$crashlytics_dir/$script"
            chmod +x "$crashlytics_dir/$script"
          done
          echo "CRASHLYTICS_RUN_SCRIPT=$crashlytics_dir/run" >> "$GITHUB_ENV"

      - name: Build ipa
        run: nix develop --command bash -c 'cd mobile_app && flutter build ipa --flavor prod --dart-define-from-file=dart_defines/prod.json --export-options-plist=./ios/ExportOptions.plist'

      # flutter build ipa は exportArchive 失敗でも exit 0 を返すため、
      # IPA 不在をここで検出してビルド検証を fail させる
      - name: Detect path for ipa file
        run: |
          ipa_path="$(find mobile_app/build/ios/ipa -type f -name '*.ipa' | head -n 1)"
          if [[ -z "$ipa_path" ]]; then
            echo "No .ipa found under mobile_app/build/ios/ipa" >&2
            exit 1
          fi
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload to App Store Connect
        if: github.event_name != 'workflow_dispatch' || inputs.upload
        env:
          APPLE_APPLE_ID: ${{ secrets.APPLE_APPLE_ID }}
          APPLE_APP_PASS: ${{ secrets.APPLE_APP_PASS }}
        run: xcrun altool --upload-app --type ios -f "$IPA_PATH" -u "$APPLE_APPLE_ID" -p "$APPLE_APP_PASS"
