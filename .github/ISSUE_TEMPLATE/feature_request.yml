name: 機能リクエスト
description: 新機能の提案
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 提案する機能の概要を記述してください。
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 背景・動機
      description: この機能が必要な背景や動機を記述してください。
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 提案する解決策
      description: 解決策のアイデアがあれば記述してください。
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した代替案があれば記述してください。
    validations:
      required: false
