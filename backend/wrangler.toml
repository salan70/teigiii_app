name = "teigiii-api"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[vars]
FIREBASE_PROJECT_ID = "everyone-teigi-dev"
FIREBASE_PROJECT_NUMBER = "225028441501"
AVATAR_BASE_URL = "http://localhost:8787/v1"
WEB_QA_PAGES_PROJECT = "teigiii-web-dev"

[[d1_databases]]
binding = "DB"
database_name = "teigiii-local"
database_id = "local"
migrations_dir = "drizzle"

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "teigiii-telemetry-local"
database_id = "local"
migrations_dir = "drizzle-telemetry"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "teigiii-local-avatars"

[env.dev]
name = "teigiii-api-dev"

[env.dev.vars]
FIREBASE_PROJECT_ID = "everyone-teigi-dev"
FIREBASE_PROJECT_NUMBER = "225028441501"
AVATAR_BASE_URL = "https://teigiii-api-dev.tetsuo21ad.workers.dev/v1"
WEB_QA_PAGES_PROJECT = "teigiii-web-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "teigiii-dev"
database_id = "3a8c086b-4704-4277-9c89-14e45fc00e92"
migrations_dir = "drizzle"

[[env.dev.d1_databases]]
binding = "TELEMETRY_DB"
database_name = "teigiii-telemetry-dev"
database_id = "63d633bb-edd7-4937-ac16-4e53969113bc"
migrations_dir = "drizzle-telemetry"

[[env.dev.r2_buckets]]
binding = "AVATARS"
bucket_name = "teigiii-dev-avatars"

[env.prod]
