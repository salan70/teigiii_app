name: teigi_app
description: A new Flutter project.

version: 1.2.1+11
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations: 
    sdk: flutter

  app_tracking_transparency: ^2.0.4
  auto_route: ^9.3.0
  cached_network_image: ^3.3.0
  collection: ^1.17.2
  cupertino_icons: ^1.0.2
  device_preview: ^1.1.0
  device_info_plus: ^9.1.0
  dio: ^5.7.0
  easy_refresh: ^3.3.2+1
  flutter_cache_manager: ^3.4.1
  flutter_dotenv: ^5.1.0
  flutter_riverpod: ^2.4.3
  freezed_annotation: ^2.4.1
  gap: ^3.0.1
  google_mobile_ads: ^9.0.0
  image_cropper: ^9.0.0
  image_picker: ^1.0.4
  in_app_review: ^2.0.8
  intl: ^0.20.2
  keyboard_actions: ^4.2.0
  like_button: ^2.0.5
  package_info_plus: ^4.2.0
  pull_down_button: ^0.9.3
  riverpod_annotation: ^2.2.0
  roggle: ^0.4.2+1
  shared_preferences: ^2.2.2
  shimmer: ^3.0.0
  url_launcher: ^6.2.1
  version: ^3.0.2

  # Workers API クライアント（backend/openapi.json から生成）
  teigiii_api:
    path: packages/teigiii_api

  # Firebase関連
  firebase_analytics: ^12.4.3
  firebase_app_check: ^0.4.5
  firebase_auth: ^6.5.4
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
    
  # tool/ds_check.dart が AST 走査に使う（custom_lint plugin は作らない方針。#262）
  # analyzer 7.4.1–7.5.x: dart_style 3 / freezed 2.5.8 / mockito 5.4.6 と整合。
  # 7.6+ は analyzer_plugin 0.12（custom_lint 0.7.3）とビルドが壊れるため上限を切る（#315）
  # riverpod_generator 2.6.5 は freezed_annotation ^3 を要求するため 2.6.4 に固定する
  analyzer: '>=7.4.1 <7.6.0'
  auto_route_generator: ^9.3.1
  build_runner: ^2.5.4
  cider: ^0.2.4
  custom_lint: '>=0.7.1 <0.7.5'
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.1.3+1
  freezed: ^2.5.8
  mockito: ^5.4.6
  pedantic_mono: ^1.24.0+1
  riverpod_generator: 2.6.4
  riverpod_lint: 2.6.4
  widgetbook: ^3.23.0

flutter:

  uses-material-design: true

  fonts:
  - family: LINESeedJP
    fonts:
      - asset: assets/fonts/LINESeedJP_A_OTF_Th.otf
        weight: 100
      - asset: assets/fonts/LINESeedJP_A_OTF_Rg.otf
        weight: 400
      - asset: assets/fonts/LINESeedJP_A_OTF_Bd.otf
        weight: 700
      - asset: assets/fonts/LINESeedJP_A_OTF_Eb.otf
        weight: 800

  assets:
    - assets/images/default_icon/
    - assets/images/introduction_icon/
    - .env

flutter_launcher_icons:
  android: true
  ios: true

flutter_native_splash:
  color: '#ffffff'
  image: 'assets/images/splash/splash.png'
  color_dark: '#000000'
  image_dark: 'assets/images/splash/splash_dark.png'
  fullscreen: true
  android_12:
    icon_background_color: '#ffffff'
    image: 'assets/images/splash/splash.png'
    icon_background_color_dark: '#000000'
    image_dark: 'assets/images/splash/splash_dark.png'

dependency_overrides:
  # riverpod_analyzer_utils → custom_lint_core が analyzer_plugin ^0.12 を引き、
  # analyzer 7.5+ とビルドが壊れる。0.13.1 で Element2 API に合わせる（#315）
  analyzer_plugin: 0.13.1
