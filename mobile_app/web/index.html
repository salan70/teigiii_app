<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Teigiii Web QA preview (dev only)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Teigiii QA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Teigiii QA</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Firebase App Check debug provider for Web QA (dev only).
    Default `true` auto-generates a token (printed in the browser console).
    Build scripts may replace this in build/web/index.html with a registered
    fixed debug token string. On Cloudflare Pages the token sits behind
    preview-only Basic Auth — see doc/plans/2026-07-25-flutter-web-qa-preview.md.
  -->
  <script>
    self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
